<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ff5a00">
  <title>DOSE Recommended Banner</title>
  <style>
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#ff5a00;
    }
    body{
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .banner{
      position:relative;
      width:1198px;
      height:502px;
      max-width:100vw;
      max-height:100vh;
      aspect-ratio:1198/502;
      overflow:hidden;
      background:#ff5a00;
    }
    video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:contain;
      object-position:center center;
      background:#ff5a00;
      pointer-events:none;
      user-select:none;
      -webkit-user-select:none;
    }
    @media (max-width:1198px){
      .banner{width:100vw;height:auto}
    }
  </style>
</head>
<body>
  <div class="banner">
    <video id="doseBanner" autoplay muted loop playsinline webkit-playsinline preload="auto"
      poster="https://d2ol7oe51mr4n9.cloudfront.net/user_3CcRKeWMAtUtgIwjfpM5Ul4MbFr/0352f59d-14f4-41f5-8d11-be561671abdb.png">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_3CcRKeWMAtUtgIwjfpM5Ul4MbFr/hf_20260923_160112_b6e8e838-e7d8-4b15-a153-42424cd3adb5.mp4" type="video/mp4">
    </video>
  </div>
  <script>
    const v=document.getElementById('doseBanner');
    v.muted=true;
    const start=()=>v.play().catch(()=>{});
    start();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)start()});
    window.addEventListener('pageshow',start);
  </script>
</body>
</html>
